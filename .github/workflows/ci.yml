# CI
# Pre-merge gate. Runs once per commit: pull_request covers topic branches,
# push covers only main and dev. Trunk runs are never cancelled -- see the
# concurrency block for why.
#
# See .github/workflows/README.md for the full workflow overview.

name: CI

# No `paths:` filter. This workflow produces the checks branch protection
# requires, and a filtered-out workflow never reports them, so the PR waits
# forever on a check that will not start. 52 tracked files matched none of the
# old patterns, including .storybook/*.ts, the root vitest configs, scripts/*.ts,
# commitlint.config.ts, .husky/* and .gitattributes.
on:
  workflow_dispatch:
  pull_request:
  # Trunk only. Topic branches are covered by pull_request; listing them here
  # too runs CI twice per commit, and the two runs land in different
  # concurrency groups (refs/heads/<branch> vs refs/pull/<n>/merge) so neither
  # cancels the other.
  push:
    branches:
      - main
      - dev

concurrency:
  # Pull requests: one run per PR, a new push supersedes the previous run.
  # Trunk: one group per commit, never cancelled. Runs are not created in
  # commit order, so a shared trunk group lets an older commit's run cancel a
  # newer one -- and a shared group cancels pending runs too, not just
  # in-progress ones -- which leaves main HEAD unverified.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lockfile drift hint
        if: failure()
        run: |
          echo "::error title=yarn.lock is out of sync with package manifests::The previous step failed with YN0028 because yarn.lock does not match the current workspace versions. Run 'yarn install' locally, commit the updated yarn.lock, and push. See docs/superpowers/specs/2026-04-20-fix-ci-lockfile-design.md for context."
          exit 1

      - name: Lint check
        run: yarn lint:check

      - name: Format check
        run: yarn format:check

      - name: Stylelint check
        run: yarn stylelint:check

      - name: Type check
        run: yarn typecheck

      - name: Locales check
        run: yarn check:locales

      - name: Circular deps check
        run: yarn check:circular

      - name: Layer violations check
        run: yarn check:layers

  test:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lockfile drift hint
        if: failure()
        run: |
          echo "::error title=yarn.lock is out of sync with package manifests::The previous step failed with YN0028 because yarn.lock does not match the current workspace versions. Run 'yarn install' locally, commit the updated yarn.lock, and push. See docs/superpowers/specs/2026-04-20-fix-ci-lockfile-design.md for context."
          exit 1

      - name: Run framework tests
        run: yarn workspace @vc-shell/framework run test

  # Deploy the hosted Storybook preview. storybook-ci.yml is a reusable
  # (workflow_call) workflow with no push trigger of its own; the caller that
  # used to invoke it lived in the removed main.yml. This job restores that
  # invocation. It deliberately omits the `release:` skip guard the other jobs
  # carry, so the release commit pushed to main also redeploys Storybook.
  storybook:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/redesign')
    permissions:
      contents: read
      packages: write
      deployments: write
    uses: ./.github/workflows/storybook-ci.yml
    with:
      event_name: ${{ github.event_name }}
    secrets: inherit

  # Story tests: every story renders in Chromium, its play function runs, and
  # axe checks it (WCAG 2.1 A/AA + 2.2 A/AA). This is the only gate that
  # executes story code — typecheck excludes *.stories.ts, ESLint sees nothing
  # wrong in an unimported identifier, and storybook-build only compiles.
  # `yarn build` first: the Storybook config resolves @vc-shell/config-generator,
  # a workspace package. The storybookTest plugin starts its own Storybook on
  # port 6011 (see vitest.config.storybook.ts).
  storybook-tests:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspace packages
        run: yarn build

      # Keyed on the resolved playwright version, not yarn.lock: the browser
      # revision only changes when playwright does, so an unrelated dependency
      # bump must not throw the cache away.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Must be the workspace binary, not `yarn dlx`: dlx resolves a different
      # playwright and installs browsers under a revision @vitest/browser will
      # not look for.
      #
      # The download is the slow part and it is not always fast: this step has
      # been observed taking anywhere from 20s to over 20 minutes, which on a
      # 25-minute job means the tests never get to run. The system libraries
      # live outside the cached directory, so they are installed either way --
      # `install-deps` alone is seconds, the browser download is not.
      - name: Install Chromium and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - name: Install system deps for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      - name: Run story tests
        run: yarn test:storybook
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

  # PR-only validation: build the Storybook bundle so a broken story (bad
  # import, invalid syntax) fails review instead of only surfacing after merge
  # on the main-push deploy above. Build only — no Docker image, no ArgoCD
  # deploy. The full deploy path is the `storybook` job, gated to push.
  storybook-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build framework
        run: yarn build

      - name: Build Storybook
        run: yarn build:storybook
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

  # The single check branch protection should require. It runs on every event,
  # even when a dependency fails, so it always reports a result -- unlike the
  # jobs it watches, which report nothing when their event or condition skips
  # them and leave a required check pending forever.
  #
  # Pointing protection here instead of at the individual jobs means adding,
  # renaming or splitting a job needs no ruleset change. The cost is that the
  # `needs` list below is now load-bearing: a job dropped from it stops gating.
  ci-gate:
    if: always()
    needs: [static-checks, test, storybook-tests, storybook-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results of required jobs
        env:
          # A skipped job is a pass: storybook-build is pull-request only, and
          # everything skips on a `release:` commit.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(printf '%s' "$NEEDS" | jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map("\(.key)=\(.value.result)")
            | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error title=CI gate failed::$bad"
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."
