# CI
# Pre-merge gate. Two parallel jobs: static-checks (lint:check,
# format:check, stylelint:check, typecheck, check:locales, check:circular,
# check:layers) and test (framework unit tests). Both must pass for
# branch-protection to allow a merge into main.
#
# See .github/workflows/README.md for the full workflow overview.

name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "framework/**"
      - "cli/**"
      - "configs/**"
      - "packages/**"
      - "**/*.json"
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".stylelintrc.json"
      - "yarn.lock"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - dev
      - "feat/**"
    paths:
      - "framework/**"
      - "cli/**"
      - "configs/**"
      - "packages/**"
      - "**/*.json"
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".stylelintrc.json"
      - "yarn.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lockfile drift hint
        if: failure()
        run: |
          echo "::error title=yarn.lock is out of sync with package manifests::The previous step failed with YN0028 because yarn.lock does not match the current workspace versions. Run 'yarn install' locally, commit the updated yarn.lock, and push. See docs/superpowers/specs/2026-04-20-fix-ci-lockfile-design.md for context."
          exit 1

      - name: Lint check
        run: yarn lint:check

      - name: Format check
        run: yarn format:check

      - name: Stylelint check
        run: yarn stylelint:check

      - name: Type check
        run: yarn typecheck

      - name: Locales check
        run: yarn check:locales

      - name: Circular deps check
        run: yarn check:circular

      - name: Layer violations check
        run: yarn check:layers

  test:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lockfile drift hint
        if: failure()
        run: |
          echo "::error title=yarn.lock is out of sync with package manifests::The previous step failed with YN0028 because yarn.lock does not match the current workspace versions. Run 'yarn install' locally, commit the updated yarn.lock, and push. See docs/superpowers/specs/2026-04-20-fix-ci-lockfile-design.md for context."
          exit 1

      - name: Run framework tests
        run: yarn workspace @vc-shell/framework run test

      # Stories are excluded from `yarn typecheck` (framework/tsconfig.json) and
      # ESLint reports nothing for an undefined identifier in a story file, so
      # this is the ONLY gate that catches a broken story — one shipped that way
      # (VCST-5597). It also carries the axe accessibility assertions.
      # Must use the workspace's own playwright, not `yarn dlx`: dlx resolves a
      # separate (newer) playwright and installs browsers keyed to its version,
      # while @vitest/browser looks them up under the version pinned here — the
      # binary then "doesn't exist" (chromium_headless_shell-<rev>).
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run Storybook tests (stories + axe)
        run: yarn test:storybook

  # Deploy the hosted Storybook preview. storybook-ci.yml is a reusable
  # (workflow_call) workflow with no push trigger of its own; the caller that
  # used to invoke it lived in the removed main.yml. This job restores that
  # invocation. It deliberately omits the `release:` skip guard the other jobs
  # carry, so the release commit pushed to main also redeploys Storybook.
  storybook:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/redesign')
    permissions:
      contents: read
      packages: write
      deployments: write
    uses: ./.github/workflows/storybook-ci.yml
    with:
      event_name: ${{ github.event_name }}
    secrets: inherit

  # PR-only validation: build the Storybook bundle so a broken story (bad
  # import, invalid syntax) fails review instead of only surfacing after merge
  # on the main-push deploy above. Build only — no Docker image, no ArgoCD
  # deploy. The full deploy path is the `storybook` job, gated to push.
  storybook-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build framework
        run: yarn build

      - name: Build Storybook
        run: yarn build:storybook
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
