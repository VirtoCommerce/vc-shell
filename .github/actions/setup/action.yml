name: Setup Node and dependencies
description: Node 22, corepack, and `yarn install --immutable` with node_modules restored from cache.

inputs:
  save-cache:
    description: Save node_modules on a cache miss. Set it on one job per workflow so parallel jobs do not race to write the same key.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node 22
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: "yarn"
        cache-dependency-path: "yarn.lock"

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    # The install still runs on a hit and fixes up anything the cache got
    # wrong, so the key only has to change when the dependency set does.
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          */*/node_modules
          framework/node_modules
          .yarn/install-state.gz
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

    - name: Install dependencies
      id: install
      shell: bash
      run: yarn install --immutable

    - name: Lockfile drift hint
      if: failure() && steps.install.outcome == 'failure'
      shell: bash
      run: |
        echo "::error title=yarn.lock is out of sync with package manifests::yarn install --immutable failed, usually with YN0028 because yarn.lock does not match the workspace manifests. Run 'yarn install' locally, commit the updated yarn.lock, and push."
        exit 1

    - name: Save node_modules
      if: inputs.save-cache == 'true' && steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          */*/node_modules
          framework/node_modules
          .yarn/install-state.gz
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
